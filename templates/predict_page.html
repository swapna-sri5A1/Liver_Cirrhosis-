<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liver Cirrhosis Prediction</title>
    <!-- Change 'style.css' to 'liver_style.css' -->
    <link rel="stylesheet" href="{{ url_for('static', filename='liver_style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Revolutionizing Liver Care</h1>
        <h2>Predicting Liver Cirrhosis using Machine Learning</h2>
        
        <form action="/predict" method="post" class="predict-form">
            <!-- Form content remains exactly the same -->
            <div class="form-grid">
                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" placeholder="e.g., 45" required>
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <div class="radio-group">
                        <input type="radio" id="male" name="gender" value="1" required> <label for="male">Male</label>
                        <input type="radio" id="female" name="gender" value="0"> <label for="female">Female</label>
                    </div>
                </div>
                <div class="form-group">
                    <label for="total_bilirubin">Total Bilirubin (mg/dL)</label>
                    <input type="number" step="0.1" id="total_bilirubin" name="total_bilirubin" placeholder="e.g., 1.2" required>
                </div>
                <div class="form-group">
                    <label for="direct_bilirubin">Direct Bilirubin (mg/dL)</label>
                    <input type="number" step="0.1" id="direct_bilirubin" name="direct_bilirubin" placeholder="e.g., 0.5" required>
                </div>
                <div class="form-group">
                    <label for="alkaline_phosphotase">Alkaline Phosphotase (IU/L)</label>
                    <input type="number" id="alkaline_phosphotase" name="alkaline_phosphotase" placeholder="e.g., 190" required>
                </div>
                <div class="form-group">
                    <label for="alamine_aminotransferase">Alamine Aminotransferase (U/L)</label>
                    <input type="number" id="alamine_aminotransferase" name="alamine_aminotransferase" placeholder="e.g., 30" required>
                </div>
                <div class="form-group">
                    <label for="aspartate_aminotransferase">Aspartate Aminotransferase (U/L)</label>
                    <input type="number" id="aspartate_aminotransferase" name="aspartate_aminotransferase" placeholder="e.g., 45" required>
                </div>
                <div class="form-group">
                    <label for="total_protiens">Total Proteins (g/dL)</label>
                    <input type="number" step="0.1" id="total_protiens" name="total_protiens" placeholder="e.g., 7.0" required>
                </div>
                <div class="form-group">
                    <label for="albumin">Albumin (g/dL)</label>
                    <input type="number" step="0.1" id="albumin" name="albumin" placeholder="e.g., 3.5" required>
                </div>
                <div class="form-group">
                    <label for="albumin_and_globulin_ratio">Albumin/Globulin Ratio</label>
                    <input type="number" step="0.1" id="albumin_and_globulin_ratio" name="albumin_and_globulin_ratio" placeholder="e.g., 0.9" required>
                </div>
            </div>
            <div class="button-container">
                <button type="submit" class="predict-btn">Predict</button>
            </div>
        </form>
        <p class="disclaimer">Disclaimer: This prediction is based on a machine learning model and is not a substitute for professional medical advice.</p>
    </div>
</body>
</html>
