<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>
    <!-- Change 'style.css' to 'liver_style.css' -->
    <link rel="stylesheet" href="{{ url_for('static', filename='liver_style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Prediction Result</h1>
        <div class="result-box">
            <p class="result-text">{{ result }}</p>
            <p class="confidence-text">{{ confidence }}</p>
        </div>
        <a href="/" class="back-btn">Go Back to Predictor</a>
    </div>
</body>
</html>
